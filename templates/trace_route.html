<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trace Route — Net-Scout</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='netscout.css') }}" />

  <style>
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; background:var(--panel-bg); color:var(--panel-text); }
    header { display:flex; align-items:center; gap:12px; padding:10px; background:var(--bg); color:var(--topbar-text); }
    #mapWrap { height: 72vh; padding:8px; }
    #map { height:100%; width:100%; border-radius:6px; }
    #console { height:28vh; padding:12px; background:var(--panel-bg); color:var(--panel-text); border-top:1px solid var(--table-border); overflow:auto; font-family:monospace; font-size:13px; white-space:pre-wrap; }
    .controls { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .btn { background:var(--btn-primary); color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; }
    .btn.secondary { background:var(--btn-secondary); }
    .trace-info { font-size:13px; line-height:1.25; }
    .muted { color:var(--muted); }
    .ns-pre { background: var(--popup-pre-bg); color: var(--popup-text); padding:6px; border-radius:4px; white-space:pre-wrap; font-family:monospace; font-size:12px; }
    .hop-label-inline {
      display:inline-block;
      background: rgba(255,255,255,0.95);
      border-radius:4px;
      padding:2px 6px;
      font-weight:700;
      color:#000;
      font-size:13px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      border: 1px solid rgba(0,0,0,0.08);
      line-height:1;
    }
    @media (max-width: 900px) {
      #mapWrap { height: 55vh; }
      #console { height:45vh; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; flex-direction:column;">
      <strong>Trace Route</strong>
      <span class="muted">Visual traceroute hops and CLI output</span>
    </div>

    <div class="controls">
      <button id="returnBtn" class="btn">Return to Net-Scout</button>
      <button id="runBtn" class="btn">Run Trace Route</button>
      <button id="autoZoomBtn" class="btn">Auto-zoom</button>
      <label style="display:flex; align-items:center; gap:6px; margin-left:8px;">
        <input id="themeToggleTrace" type="checkbox" /> <span class="muted">Light theme</span>
      </label>
    </div>
  </header>

  <div id="mapWrap">
    <div id="map"></div>
  </div>

  <div id="console" aria-live="polite">Loading traceroute output...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  (function () {
    const API_TRACE = "/api/trace";
    const API_TRACE_RUN = "/api/trace_run";
    const params = new URLSearchParams(window.location.search);
    const alertId = params.get("alert_id");
    const focusIp = params.get("focus_ip") || null;

    let map = null;
    let tileLight, tileDark;
    let markersLayer;
    let hopsPolyline = null;
    let currentTheme = localStorage.getItem("netscout_theme") || "dark";

    // Troy fallback coordinates for 192.168.50.*
    const TROY = { lat: 42.7284, lon: -73.6918, city: "Troy", state: "NY", country: "US" };

    function initMap() {
      map = L.map("map", { zoomControl: true }).setView([20, 0], 2);
      tileLight = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { attribution: '&copy; OpenStreetMap contributors' });
      tileDark = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { attribution: '&copy; OpenStreetMap contributors' });
      if (currentTheme === "light") tileLight.addTo(map); else tileDark.addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      map.whenReady(() => setTimeout(() => map.invalidateSize(), 150));
      window.addEventListener("resize", () => setTimeout(() => map.invalidateSize(), 150));
    }

    function setTheme(theme) {
      currentTheme = theme;
      localStorage.setItem("netscout_theme", theme);
      if (!map) return;
      if (theme === "light") {
        if (map.hasLayer(tileDark)) map.removeLayer(tileDark);
        tileLight.addTo(map);
      } else {
        if (map.hasLayer(tileLight)) map.removeLayer(tileLight);
        tileDark.addTo(map);
      }
    }

    function fitToHops() {
      try {
        const layers = markersLayer.getLayers();
        if (!layers.length) return;
        const group = L.featureGroup(layers);
        const bounds = group.getBounds();
        if (bounds && bounds.isValid()) {
          map.fitBounds(bounds.pad(0.15));
        }
      } catch (e) {
        console.warn("fitToHops failed", e);
      }
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; });
    }

    function renderConsoleFormatted(hops, raw, meta, plotted, skipped) {
      const el = document.getElementById("console");
      const lines = [];
      if (meta && meta.cmd) lines.push(`cmd: ${meta.cmd}`);
      if (meta && meta.stderr) lines.push(`stderr: ${meta.stderr}`);
      lines.push("");
      if (!hops || !hops.length) {
        lines.push(raw || "No traceroute output available.");
        el.textContent = lines.join("\n");
        el.scrollTop = el.scrollHeight;
        return;
      }
      hops.forEach(h => {
        const hop = h.hop || "?";
        const ip = h.ip || "*";
        const rdns = h.rdns || "";
        const times = (h.times && h.times.length) ? h.times.map(t => `${t} ms`).join("  ") : (h.output && h.output.includes("*") ? "* * *" : "");
        const geo = (h.city || h.state || h.country) ? ` (${[h.city, h.state, h.country].filter(Boolean).join(", ")})` : "";
        const rdnsPart = rdns ? `${rdns} ` : "";
        const ipPart = ip !== "*" ? `[${ip}]` : ip;
        const line = `Hop ${hop}: ${ipPart} ${rdnsPart}${geo}  ${times}`;
        lines.push(line);
      });
      if (raw && raw.trim()) {
        lines.push("");
        lines.push("Raw traceroute output:");
        lines.push(raw);
      }

      // plotted / skipped summary
      lines.push("");
      lines.push(`Plotted hops: ${plotted.length ? plotted.map(p => p.hop).join(", ") : "none"}`);
      lines.push(`Skipped hops: ${skipped.length ? skipped.map(s => s.hop).join(", ") : "none"}`);

      el.textContent = lines.join("\n");
      el.scrollTop = el.scrollHeight;
    }

    function buildHopPopup(h) {
      const parts = [];
      parts.push(`<div style="font-weight:700;margin-bottom:6px;">Hop ${h.hop}</div>`);
      parts.push(`<div><b>IP:</b> ${escapeHtml(h.ip || "n/a")}</div>`);
      if (h.rdns) parts.push(`<div><b>RDNS:</b> ${escapeHtml(h.rdns)}</div>`);
      if (h.city || h.state || h.country) {
        parts.push(`<div><b>Location:</b> ${escapeHtml([h.city, h.state, h.country].filter(Boolean).join(", "))}</div>`);
      }
      if (h.lat !== undefined && h.lon !== undefined && h.lat !== null && h.lon !== null) parts.push(`<div class="ns-pre"><b>Lat, Lon:</b> ${h.lat}, ${h.lon}</div>`);
      if (h.times && h.times.length) parts.push(`<div class="ns-pre">${h.times.join(" ms  ")} ms</div>`);
      if (h.output) parts.push(`<div class="ns-pre">${escapeHtml(h.output)}</div>`);
      return parts.join("");
    }

    /**
     * plotHops
     * - plots markers with a tiny deterministic jitter when multiple hops share identical coords
     * - draws polyline using the true coordinates (no jitter) so path remains geographically accurate
     */
    function plotHops(hops) {
      markersLayer.clearLayers();
      if (hopsPolyline) {
        try { map.removeLayer(hopsPolyline); } catch (e) {}
        hopsPolyline = null;
      }

      // Build arrays and maps
      const sorted = (hops || []).slice().sort((a,b) => (a.hop||0) - (b.hop||0));
      const coordKeyCounts = {}; // "lat,lon" -> count
      const coordKeyIndices = {}; // "lat,lon" -> next index for jitter
      const latlngsForPolyline = []; // true coords in hop order
      const plotted = [];
      const skipped = [];

      // First pass: count identical coordinate occurrences (treat null/undefined as missing)
      sorted.forEach(h => {
        const lat = (h.lat !== null && h.lat !== undefined) ? Number(h.lat) : NaN;
        const lon = (h.lon !== null && h.lon !== undefined) ? Number(h.lon) : NaN;
        if (isFinite(lat) && isFinite(lon)) {
          const key = `${lat.toFixed(6)},${lon.toFixed(6)}`;
          coordKeyCounts[key] = (coordKeyCounts[key] || 0) + 1;
        }
      });

      // Second pass: plot markers (with jitter for duplicates) and build polyline coords
      sorted.forEach((h, idx) => {
        // Troy fallback client-side if server didn't provide coords
        if ((h.lat === null || h.lat === undefined || h.lon === null || h.lon === undefined) && h.ip && h.ip.startsWith("192.168.50.")) {
          h.lat = TROY.lat;
          h.lon = TROY.lon;
          h.city = h.city || TROY.city;
          h.state = h.state || TROY.state;
          h.country = h.country || TROY.country;
        }

        const lat = (h.lat !== null && h.lat !== undefined) ? Number(h.lat) : NaN;
        const lon = (h.lon !== null && h.lon !== undefined) ? Number(h.lon) : NaN;

        if (!isFinite(lat) || !isFinite(lon)) {
          skipped.push(h);
          return;
        }

        // Add true coordinate to polyline array (preserve order)
        latlngsForPolyline.push([lat, lon]);

        // Determine jitter if this coordinate is shared
        const key = `${lat.toFixed(6)},${lon.toFixed(6)}`;
        const count = coordKeyCounts[key] || 1;
        let jitterLat = lat;
        let jitterLon = lon;
        if (count > 1) {
          // deterministic pseudo-random offset based on hop number and index
          coordKeyIndices[key] = (coordKeyIndices[key] || 0) + 1;
          const i = coordKeyIndices[key];
          // small offsets in degrees (~ up to ~0.0015 deg ~ ~150m) — tiny enough to not mislead
          const base = 0.00035; // ~39m at equator
          // spread points in a small spiral pattern
          const angle = (i * 2.61803398875) % (2 * Math.PI); // golden-angle-like step
          const radius = base * (Math.ceil(i / 6)); // increase radius every 6 points
          jitterLat = lat + Math.cos(angle) * radius;
          jitterLon = lon + Math.sin(angle) * radius;
        }

        // Create visible circle marker at jittered position
        const marker = L.circleMarker([jitterLat, jitterLon], {
          radius: 7,
          fillColor: "#2b9cff",
          color: "#003049",
          weight: 1,
          opacity: 1,
          fillOpacity: 0.95
        });

        marker.bindPopup(buildHopPopup(h), { maxWidth: 420 });
        markersLayer.addLayer(marker);

        // label icon with inline styling; anchor adjusted so label sits above jittered marker
        const labelHtml = `<span class="hop-label-inline">${escapeHtml(String(h.hop || ""))}</span>`;
        const labelIcon = L.divIcon({
          html: labelHtml,
          className: '',
          iconSize: [30, 18],
          iconAnchor: [15, -12]
        });
        const labelMarker = L.marker([jitterLat, jitterLon], { icon: labelIcon, interactive: false });
        markersLayer.addLayer(labelMarker);

        plotted.push({ hop: h.hop, ip: h.ip, lat: lat, lon: lon });
      });

      // Draw polyline using true coordinates (no jitter)
      if (latlngsForPolyline.length >= 2) {
        hopsPolyline = L.polyline(latlngsForPolyline, { color: '#ff7f50', weight: 3, opacity: 0.9 }).addTo(map);
      }

      return { plotted, skipped };
    }

    async function fetchTrace(alert_id) {
      try {
        const url = `${API_TRACE}?alert_id=${encodeURIComponent(alert_id)}`;
        const res = await fetch(url);
        if (!res.ok) {
          const txt = await res.text();
          document.getElementById("console").textContent = `Failed to fetch traceroute: ${res.status} ${res.statusText}\n${txt}`;
          return null;
        }
        const data = await res.json();
        return data;
      } catch (e) {
        console.error("fetchTrace error", e);
        document.getElementById("console").textContent = "Error fetching traceroute data.";
        return null;
      }
    }

    async function runTraceOnServer(opts = {}) {
      try {
        const res = await fetch(API_TRACE_RUN, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(opts)
        });
        if (!res.ok) {
          const txt = await res.text();
          document.getElementById("console").textContent = `Trace run failed: ${res.status} ${res.statusText}\n${txt}`;
          return null;
        }
        const data = await res.json();
        return data;
      } catch (e) {
        console.error("runTraceOnServer error", e);
        document.getElementById("console").textContent = "Error running traceroute on server.";
        return null;
      }
    }

    // Wire UI
    document.getElementById("returnBtn").addEventListener("click", () => {
      window.location.href = "/netscout";
    });
    document.getElementById("autoZoomBtn").addEventListener("click", () => fitToHops());
    document.getElementById("themeToggleTrace").addEventListener("change", (ev) => {
      setTheme(ev.target.checked ? "light" : "dark");
    });
    document.getElementById("runBtn").addEventListener("click", async () => {
      if (!alertId) {
        document.getElementById("console").textContent = "No alert_id provided. Cannot run traceroute.";
        return;
      }
      document.getElementById("console").textContent = "Running traceroute (single run)...";
      const res = await runTraceOnServer({ alert_id: alertId });
      if (!res) return;
      const hops = res.hops || [];
      const raw = res.raw_output || "";
      const meta = { cmd: res.cmd, stderr: res.stderr };
      const { plotted, skipped } = plotHops(hops);
      renderConsoleFormatted(hops, raw, meta, plotted, skipped);
    });

    // Initialize
    initMap();
    setTheme(currentTheme);

    (async function main() {
      if (!alertId) {
        document.getElementById("console").textContent = "No alert_id provided. Open this page with ?alert_id=<id>.";
        return;
      }

      document.getElementById("console").textContent = "Loading stored traceroute data...";
      const stored = await fetchTrace(alertId);
      if (!stored) return;

      const storedHops = stored.hops || stored.traceroute_hops || [];
      const raw = stored.raw_output || stored.traceroute_raw || stored.raw || "";
      const meta = (stored.traceroute_meta) ? stored.traceroute_meta : { cmd: stored.cmd, stderr: stored.stderr };

      const { plotted, skipped } = plotHops(storedHops);
      renderConsoleFormatted(storedHops, raw, meta, plotted, skipped);

      // focus popup if requested
      if (focusIp) {
        setTimeout(() => {
          markersLayer.eachLayer(layer => {
            try {
              if (layer && layer.getLatLng && layer.getPopup) {
                const popup = layer.getPopup();
                if (!popup) return;
                const content = popup.getContent();
                if (content && content.includes(focusIp)) {
                  layer.openPopup();
                }
              }
            } catch (e) {}
          });
        }, 600);
      }
    })();
  })();
  </script>
</body>
</html>
